# ==============================================================================
# GEOPORTAL DE GESTIÓN PREDIAL - NGINX REVERSE PROXY CONFIGURATION
# DESCRIPCIÓN: Configuración de seguridad para aislar GeoServer (Puerto 8080) 
# y exponer el visor HTML/JS bajo HTTPS Seguro.
# ==============================================================================

server {
    listen 80;
    server_name geoportal.joringenieros.com;
    
    # Redirección estricta a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name geoportal.joringenieros.com;

    # SSL Certificates (Requeridos por Ley 1192 de Seguridad de Información)
    ssl_certificate /etc/letsencrypt/live/geoportal.joringenieros.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geoportal.joringenieros.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 1. SERVIR FRONTEND ESTATICO
    location / {
        root /var/www/geoportal/portal;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Compresión en frontend
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }

    # 2. PROXY DE GEOSERVER (Aislamiento Seguro)
    # Se expone un alias /geoserver pero se protege de peticiones externas no autorizadas
    location /geoserver/ {
        proxy_pass http://127.0.0.1:8080/geoserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evitar CORS issues permitiendo origen estricto
        add_header 'Access-Control-Allow-Origin' 'https://geoportal.joringenieros.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        
        # Bloquear ediciones directas a WFS-T 
        limit_except GET POST OPTIONS {
            deny all;
        }
    }
}
